
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEURO-SCAN | Biometric Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;700&display=swap');
    
    body {
      background-color: #050505;
      color: #00ff41;
      font-family: 'Space Mono', monospace;
      overflow-x: hidden;
    }

    .crt::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    .glitch {
      text-shadow: 2px 0 #ff00c1, -2px 0 #00fff9;
      animation: glitch-anim 2s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { text-shadow: 2px 0 #ff00c1, -2px 0 #00fff9; }
      50% { text-shadow: -2px 0 #ff00c1, 2px 0 #00fff9; }
      100% { text-shadow: 1px 0 #ff00c1, -1px 0 #00fff9; }
    }

    .scanline {
      width: 100%;
      height: 2px;
      background: rgba(0, 255, 65, 0.5);
      position: absolute;
      top: 0;
      animation: scan 3s linear infinite;
      z-index: 10;
      box-shadow: 0 0 10px #00ff41;
    }

    @keyframes scan {
      from { top: 0%; }
      to { top: 100%; }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="crt">
  <div id="root"></div>
</body>
</html>
